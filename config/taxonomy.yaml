# Declarative Taxonomy & Tag Expansion Configuration
# To add a new category or technical tag rule:
# 1. Append an entry under `categories` or `technical_tags` below.
# 2. Run `uv run python -m src.cli retag` to retroactively re-index all records in data/papers.json.

default_category: "Foundations & Acceleration"
emergent_tag_min_count: 2

categories:
  - name: "Foundations & Acceleration"
    slug: "foundations"
    description: "Core 3DGS theory, fast rasterizers, anti-aliasing, level-of-detail, and CUDA rendering pipelines."
    keywords:
      - "rasterization"
      - "rasterizer"
      - "anti-aliasing"
      - "mip-splatting"
      - "cuda"
      - "real-time rendering"
      - "level of detail"
      - "lod"
      - "ray tracing"
      - "spherical harmonics"
      - "densification"
      - "pruning"
      - "3dgs survey"
      - "survey"

  - name: "Dynamic & 4DGS"
    slug: "dynamic-4dgs"
    description: "4D Gaussian Splatting, dynamic scene reconstruction, spacetime deformation, and free-viewpoint video."
