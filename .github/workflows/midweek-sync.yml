name: Mid-Week Trunk Sync (No Deploy)

on:
  schedule:
    # Runs Wednesday at 14:00 UTC (60h after Monday 02:00 UTC ingest -> strictly <72h TBD SLA)
    - cron: "0 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  midweek-trunk-sync:
    name: Wednesday Trunk Sync (feed -> main, No Deploy)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Merge origin/feed and verify OBT integrity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feed main
          git merge origin/feed --no-edit -m "chore(sync): mid-week trunk sync from feed (<72h TBD SLA)"
          uv run python -m src.cli build
          uv run ruff check .
          uv run pytest -v
          uv run python -m src.cli validate

      - name: Push synced main and align feed branch
        run: |
          git add data/papers.json docs/papers.json README.md
          git diff --cached --quiet || git commit -m "chore(sync): rebuild mid-week artifacts"
          git push origin main
          git checkout -B feed main
          git push origin feed
