name: Prepare Scheduled Catalog PR

on:
  schedule:
    # Wednesday review candidate; the maintainer merges the PR.
    - cron: "0 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  midweek-trunk-sync:
    name: Validate feed and open a catalog PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Merge origin/feed and verify OBT integrity
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feed main
          git merge --ff-only origin/main
          git merge origin/feed --no-edit -m "chore(sync): mid-week trunk sync from feed"
          # Optional providers retain successful caches on failure. All three
          # passes are independently budgeted; at most 15 requests / 270 seconds
          # are admitted in total (in-flight requests may finish afterward).
          mkdir -p reports/runs
          for provider in openalex semanticscholar huggingface; do
            set +e
            uv run python -m src.cli refresh-signals --provider "$provider" --due --require-key --max-requests 5 --max-seconds 90 --limit 100 --summary-file "$GITHUB_STEP_SUMMARY" > "reports/runs/signals-${provider}-latest.json" 2> "reports/runs/signals-${provider}-latest.error.txt"
            signal_status=$?
            set -e
            if (( signal_status != 0 )); then
              echo "::warning::${provider} refresh failed; retained cache will be used."
              echo "- ${provider}: refresh command failed (exit ${signal_status}); inspect reports/runs diagnostics. Cached publication may proceed." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          uv run python -m src.cli build
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
          uv run python -m src.cli validate

      - name: Prune obsolete public artifacts if the candidate exceeds the release budget
        run: |
          site_bytes=$(du --apparent-size --block-size=1 --summarize docs | cut -f1)
          release_budget=$(uv run python -c 'from src.releases import MAX_BYTES; print(MAX_BYTES)')
          if (( site_bytes <= release_budget )); then exit 0; fi

          # Protect the candidate, current main, and these previously verified releases.
          git show origin/main:docs/data/manifest.json > "$RUNNER_TEMP/retained-main-manifest.json"
          declare -A retained_digests
          current_digest=$(jq -er '.build_digest | select(test("^[a-f0-9]{64}$"))' docs/data/manifest.json)
          retained_digests["$current_digest"]=1
          retained=()
          for manifest in "$RUNNER_TEMP/retained-main-manifest.json" \
            reports/public-manifests/572056d9091426ff25b1ddbd22446784787e739a6bb94e14f743d93372008aa7.json \
            reports/public-manifests/09ad26870a189d9d453af0f3075793fe0276fbd683835e34e844be3530369278.json; do
            digest=$(jq -er '.build_digest | select(test("^[a-f0-9]{64}$"))' "$manifest")
            if [[ ${retained_digests[$digest]+present} ]]; then continue; fi
            retained_digests["$digest"]=1
            retained+=(--retain "$manifest")
          done

          plan="$RUNNER_TEMP/feed-public-cleanup-plan.json"
          receipt="reports/runs/feed-public-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          uv run python -m src.public_cleanup plan --root docs/data "${retained[@]}" \
            --max-delete-bytes 150000000 --max-scan-bytes 350000000 --output "$plan"
          uv run python -m src.public_cleanup apply --root docs/data --plan "$plan" --receipt "$receipt"

      - name: Push validated catalog to feed and open a PR if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for generated_path in data/papers.json data/manifest.json data/papers data/aliases*.json data/signals data/archive data/extraction docs/papers.json docs/data docs/assets README.md reports/coverage.md reports/runs; do
            if [[ -e "$generated_path" ]] || git ls-files --error-unmatch "$generated_path" >/dev/null 2>&1; then
              git add --all -- "$generated_path"
            fi
          done
          git diff --cached --quiet || git commit -m "chore(sync): rebuild mid-week artifacts"
          uv run python -m src.releases pack --output "$RUNNER_TEMP/feed-packing-check"
          git push origin HEAD:feed
          if git diff --quiet origin/main HEAD; then
            echo "- Feed has no changes to review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr_url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head feed --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head feed \
              --title "Update the Papers catalog" \
              --body "Review the generated catalog changes and merge with a merge commit to preserve feed history. GitHub may require approval to start checks for this workflow-created PR.")
          fi
          echo "- Catalog changes ready for review: $pr_url" >> "$GITHUB_STEP_SUMMARY"
