name: CI Quality Gate

on:
  push:
    branches: ["main", "feed"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check workflow syntax and expressions
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  lint-and-test:
    name: Ruff Lint, Format & Pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check .

      - name: Verify Node for browser projection parity
        run: node --version

      - name: Verify compiled portal CSS
        run: |
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          npm run check:css

      - name: Run Pytest unit suite
        run: uv run pytest -v

      - name: Validate OBT Schema (data/papers.json)
        run: uv run python -m src.cli validate

      - name: Rehearse packaging the Pages release
        run: uv run python -m src.releases pack --output "$RUNNER_TEMP/papers-ci-candidate"
