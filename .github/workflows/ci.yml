name: CI Quality Gate

on:
  push:
    branches: ["main", "feed"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff Lint, Format & Pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check .

      - name: Verify Node for browser projection parity
        run: node --version

      - name: Run Pytest unit suite
        run: uv run pytest -v

      - name: Validate OBT Schema (data/papers.json)
        run: uv run python -m src.cli validate
