name: Weekly arXiv Indexing Reconciliation

on:
  schedule:
    # Saturday reconciliation precedes the Sunday release.
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Maximum arXiv requests this pass; unfinished scans resume next run"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  reconcile-feed:
    name: Reconcile delayed arXiv indexing -> feed branch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feed branch
        uses: actions/checkout@v7
        with:
          ref: feed
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Resume independent 30-day updated-window reconciliation
        id: reconciliation
        env:
          MAX_REQUESTS: ${{ inputs.max_requests || '60' }}
          ENABLE_GH_MODELS: "false"
          ENABLE_GEMINI: "false"
        run: |
          if [[ ! "$MAX_REQUESTS" =~ ^[0-9]{1,4}$ ]] || (( 10#$MAX_REQUESTS < 1 || 10#$MAX_REQUESTS > 1000 )); then
            echo "max_requests must be an integer in [1, 1000]" >&2
            exit 1
          fi
          git fetch origin feed
          git merge --ff-only origin/feed
          # Bootstrap a wider update window independently of daily state. Historical coverage is a
          # separate backfill; never infer it from papers.json.last_updated.
          initial=()
          if [[ ! -e data/ingestion/weekly/active.json && ! -e data/ingestion/weekly/watermark.json ]]; then
            initial=(--since "$(date -u -d '30 days ago' +%Y-%m-%d)")
          fi
          mkdir -p reports/runs
          set +e
          uv run python -m src.cli daily "${initial[@]}" --state-dir data/ingestion/weekly --overlap-days 30 --max-seconds 900 --max-requests "$MAX_REQUESTS" > reports/runs/weekly-reconciliation-latest.json 2> reports/runs/weekly-reconciliation-latest.error.txt
          reconciliation_status=$?
          set -e
          echo "status=$reconciliation_status" >> "$GITHUB_OUTPUT"
          echo "Weekly reconciliation exit status: $reconciliation_status. Partial scans retain their cursor and do not advance the watermark. See reports/runs/weekly-reconciliation-latest.json." >> "$GITHUB_STEP_SUMMARY"
          uv run python -m src.cli build
          uv run python -m src.cli validate
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v

      - name: Commit and push delta to feed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for generated_path in data/ingestion/weekly data/papers.json data/manifest.json data/papers data/aliases*.json data/signals data/archive data/extraction docs/papers.json docs/data docs/assets README.md reports/coverage.md reports/runs; do
            if [[ -e "$generated_path" ]] || git ls-files --error-unmatch "$generated_path" >/dev/null 2>&1; then
              git add --all -- "$generated_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No reconciliation changes this pass."
          else
            DATE_UTC=$(date -u +"%Y-%m-%d")
            git commit -m "chore(feed): weekly arXiv indexing reconciliation ($DATE_UTC)"
            git push origin feed
          fi

      - name: Report required-source failure after persisting checkpoint
        if: steps.reconciliation.outputs.status != '0'
        run: exit 1
