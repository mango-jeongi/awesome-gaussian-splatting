name: Weekly Production Release & GitHub Pages Deploy

on:
  schedule:
    # Sunday publication of the approved main revision.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  release-and-build:
    name: Validate main, Tag Release & Prepare Pages
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: read
      id-token: write
      attestations: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
      source_revision: ${{ steps.candidate.outputs.source_revision }}
      weekly_tag: ${{ steps.tag.outputs.weekly_tag }}
      pages_artifact_name: ${{ steps.candidate.outputs.pages_artifact_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the approved main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Validate the approved catalog
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
          uv run python -m src.cli validate

      - name: Verify compiled portal CSS before publishing
        run: |
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          npm run check:css

      - name: Prepare a local weekly tag (vYYYY.Www)
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v$(date -u +'%G.W%V')"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Existing weekly tag points to a different release candidate" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" HEAD -m "Weekly 3DGS Database Release $TAG"
          fi

          echo "weekly_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Freeze exact code/data/site release candidate
        id: candidate
        env:
          WEEKLY_TAG: ${{ steps.tag.outputs.weekly_tag }}
        run: |
          uv run python -m src.releases pack --release-tag "$WEEKLY_TAG" --output "$RUNNER_TEMP/papers-release"
          uv run python -c 'import json, os, pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"papers-release/receipt.json").read_bytes()); print("release_id="+r["release_id"]); print("source_revision="+r["source_revision"]); print("pages_artifact_name=github-pages-"+r["release_id"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"])' >> "$GITHUB_OUTPUT"

      - name: Attest immutable release archive
        id: archive-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/papers-release/release.tar
          create-storage-record: false

      - name: Verify release provenance before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_BUNDLE: ${{ steps.archive-attestation.outputs.bundle-path }}
          EXPECTED_RELEASE_ID: ${{ steps.candidate.outputs.release_id }}
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
        run: |
          [[ "$SOURCE_REVISION" == "$GITHUB_SHA" ]] || exit 1
          gh attestation verify "$RUNNER_TEMP/papers-release/release.tar" \
            --bundle "$ATTESTATION_BUNDLE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/weekly-release.yml" \
            --source-ref refs/heads/main --source-digest "$SOURCE_REVISION" \
            --deny-self-hosted-runners
          cp -- "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/papers-release/provenance.json"
          uv run python -m src.releases restore --archive "$RUNNER_TEMP/papers-release/release.tar" \
            --expected-release-id "$EXPECTED_RELEASE_ID" --output "$RUNNER_TEMP/attested-site"

      - name: Publish the verified candidate tag and prepare the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKLY_TAG: ${{ steps.tag.outputs.weekly_tag }}
        run: |
          git push origin "refs/tags/$WEEKLY_TAG"
          if ! gh release view "$WEEKLY_TAG" >/dev/null 2>&1; then
            gh release create "$WEEKLY_TAG" --verify-tag --draft \
              --title "Weekly 3DGS Paper Digest ($WEEKLY_TAG)" --generate-notes
          fi

      - name: Retain immutable release and rollback archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papers-release-${{ steps.candidate.outputs.release_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/papers-release/release.tar
            ${{ runner.temp }}/papers-release/receipt.json
            ${{ runner.temp }}/papers-release/provenance.json
          retention-days: 90
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload frozen candidate site
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          name: ${{ steps.candidate.outputs.pages_artifact_name }}
          path: ${{ runner.temp }}/attested-site

  deploy-pages:
    name: Deploy and verify immutable candidate
    timeout-minutes: 10
    needs: release-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact candidate verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-and-build.outputs.source_revision }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.release-and-build.outputs.pages_artifact_name }}

      - name: Verify deployed manifest and every candidate file
        env:
          DEPLOYED_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE_ID: ${{ needs.release-and-build.outputs.release_id }}
        run: |
          uv run python -m src.releases verify-url --base-url "$DEPLOYED_BASE_URL" --expected-release-id "$EXPECTED_RELEASE_ID" --report "$RUNNER_TEMP/deployment-verification.json"
          echo "- Verified deployed release: $EXPECTED_RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain deployment verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-verification-${{ needs.release-and-build.outputs.release_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-verification.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish release only after deployment verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKLY_TAG: ${{ needs.release-and-build.outputs.weekly_tag }}
        run: gh release edit "$WEEKLY_TAG" --draft=false
