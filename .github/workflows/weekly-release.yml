name: Weekly Production Release & GitHub Pages Deploy

on:
  schedule:
    # Sunday public publication; source and branch freshness are reported separately.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  release-and-build:
    name: Merge feed -> main, Tag Release & Prepare Pages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Merge origin/feed, rebuild & validate
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feed main
          git merge --ff-only origin/main
          git merge origin/feed --no-edit -m "chore(release): weekly merge from feed"
          # Optional providers retain successful caches on failure. All three
          # passes are independently budgeted; at most 15 requests / 270 seconds
          # are admitted in total (in-flight requests may finish afterward).
          mkdir -p reports/runs
          for provider in openalex semanticscholar huggingface; do
            set +e
            uv run python -m src.cli refresh-signals --provider "$provider" --due --require-key --max-requests 5 --max-seconds 90 --limit 100 --summary-file "$GITHUB_STEP_SUMMARY" > "reports/runs/signals-${provider}-latest.json" 2> "reports/runs/signals-${provider}-latest.error.txt"
            signal_status=$?
            set -e
            if (( signal_status != 0 )); then
              echo "::warning::${provider} refresh failed; retained cache will be used."
              echo "- ${provider}: refresh command failed (exit ${signal_status}); inspect reports/runs diagnostics. Cached publication may proceed." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          uv run python -m src.cli build
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
          uv run python -m src.cli validate

      - name: Commit, Tag Weekly Release (vYYYY.Www) & Reset feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for generated_path in data/papers.json data/manifest.json data/papers data/aliases*.json data/signals data/archive data/extraction docs/papers.json docs/data docs/assets README.md reports/coverage.md reports/runs; do
            if [[ -e "$generated_path" ]] || git ls-files --error-unmatch "$generated_path" >/dev/null 2>&1; then
              git add --all -- "$generated_path"
            fi
          done
          git diff --cached --quiet || git commit -m "chore(release): compile weekly OBT and README"
          git push --atomic origin HEAD:main HEAD:feed

          TAG="v$(date -u +'%G.W%V')"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Existing weekly tag points to a different release candidate" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" HEAD -m "Weekly 3DGS Database Release $TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Weekly 3DGS Paper Digest ($TAG)" --generate-notes
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact (docs/)
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: release-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
