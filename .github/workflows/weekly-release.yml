name: Weekly Production Release & GitHub Pages Deploy

on:
  schedule:
    # Sunday public publication; source and branch freshness are reported separately.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  release-and-build:
    name: Merge feed -> main, Tag Release & Prepare Pages
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
      source_revision: ${{ steps.candidate.outputs.source_revision }}
      weekly_tag: ${{ steps.tag.outputs.weekly_tag }}
      pages_artifact_name: ${{ steps.candidate.outputs.pages_artifact_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Merge origin/feed, rebuild & validate
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feed main
          git merge --ff-only origin/main
          git merge origin/feed --no-edit -m "chore(release): weekly merge from feed"
          # Optional providers retain successful caches on failure. All three
          # passes are independently budgeted; at most 15 requests / 270 seconds
          # are admitted in total (in-flight requests may finish afterward).
          mkdir -p reports/runs
          for provider in openalex semanticscholar huggingface; do
            set +e
            uv run python -m src.cli refresh-signals --provider "$provider" --due --require-key --max-requests 5 --max-seconds 90 --limit 100 --summary-file "$GITHUB_STEP_SUMMARY" > "reports/runs/signals-${provider}-latest.json" 2> "reports/runs/signals-${provider}-latest.error.txt"
            signal_status=$?
            set -e
            if (( signal_status != 0 )); then
              echo "::warning::${provider} refresh failed; retained cache will be used."
              echo "- ${provider}: refresh command failed (exit ${signal_status}); inspect reports/runs diagnostics. Cached publication may proceed." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          uv run python -m src.cli build
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
          uv run python -m src.cli validate

      - name: Verify compiled portal CSS before publishing
        run: |
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          npm run check:css

      - name: Commit, Tag Weekly Release (vYYYY.Www) & Reset feed
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for generated_path in data/papers.json data/manifest.json data/papers data/aliases*.json data/signals data/archive data/extraction docs/papers.json docs/data docs/assets README.md reports/coverage.md reports/runs; do
            if [[ -e "$generated_path" ]] || git ls-files --error-unmatch "$generated_path" >/dev/null 2>&1; then
              git add --all -- "$generated_path"
            fi
          done
          git diff --cached --quiet || git commit -m "chore(release): compile weekly OBT and README"
          git push --atomic origin HEAD:main HEAD:feed

          TAG="v$(date -u +'%G.W%V')"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Existing weekly tag points to a different release candidate" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" HEAD -m "Weekly 3DGS Database Release $TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Weekly 3DGS Paper Digest ($TAG)" --generate-notes
          fi

          echo "weekly_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Freeze exact code/data/site release candidate
        id: candidate
        env:
          WEEKLY_TAG: ${{ steps.tag.outputs.weekly_tag }}
        run: |
          uv run python -m src.releases pack --release-tag "$WEEKLY_TAG" --output "$RUNNER_TEMP/papers-release"
          uv run python -c 'import json, os, pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"papers-release/receipt.json").read_bytes()); print("release_id="+r["release_id"]); print("source_revision="+r["source_revision"]); print("pages_artifact_name=github-pages-"+r["release_id"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"])' >> "$GITHUB_OUTPUT"

      - name: Retain immutable release and rollback archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papers-release-${{ steps.candidate.outputs.release_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/papers-release/release.tar
            ${{ runner.temp }}/papers-release/receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload frozen candidate site
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.candidate.outputs.pages_artifact_name }}
          path: ${{ runner.temp }}/papers-release/site

  deploy-pages:
    name: Deploy and verify immutable candidate
    timeout-minutes: 10
    needs: release-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact candidate verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-and-build.outputs.source_revision }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.release-and-build.outputs.pages_artifact_name }}

      - name: Verify deployed manifest and every candidate file
        env:
          DEPLOYED_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE_ID: ${{ needs.release-and-build.outputs.release_id }}
        run: |
          uv run python -m src.releases verify-url --base-url "$DEPLOYED_BASE_URL" --expected-release-id "$EXPECTED_RELEASE_ID" --report "$RUNNER_TEMP/deployment-verification.json"
          echo "- Verified deployed release: $EXPECTED_RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain deployment verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-verification-${{ needs.release-and-build.outputs.release_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-verification.json
          retention-days: 90
          if-no-files-found: warn

      - name: Publish release only after deployment verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKLY_TAG: ${{ needs.release-and-build.outputs.weekly_tag }}
        run: gh release edit "$WEEKLY_TAG" --draft=false
