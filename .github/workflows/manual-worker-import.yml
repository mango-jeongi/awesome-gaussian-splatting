name: Manual Reviewed Worker Import

on:
  workflow_dispatch:
    inputs:
      review_key:
        description: "Committed data/extraction/review-inputs/<key>.review.json and <key>.result.json"
        required: true
      mode:
        type: choice
        options: [preview, apply]
        default: preview

permissions:
  contents: write
concurrency:
  group: repository-writer
  cancel-in-progress: false
jobs:
  reviewed-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feed branch
        uses: actions/checkout@v7
        with:
          ref: feed
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Validate reviewed source, import decisions, and check build
        id: operation
        env:
          REVIEW_KEY: ${{ inputs.review_key }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$REVIEW_KEY" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]] || exit 1
          [[ "$MODE" == preview || "$MODE" == apply ]] || exit 1
          git fetch origin feed
          git merge --ff-only origin/feed
          echo "EXPECTED_FEED=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p reports/runs
          set +e
          uv run python -m src.manual_operations --data data/papers.json --key "$REVIEW_KEY" --output "$RUNNER_TEMP/reviewed-source.pdf" > "reports/runs/worker-${REVIEW_KEY}-source.json" 2> "reports/runs/worker-${REVIEW_KEY}-source.error.txt"
          operation_status=$?
          if (( operation_status == 0 )); then
            arguments=(--data data/papers.json --ledger data/extraction/reviewed.json --result "data/extraction/review-inputs/${REVIEW_KEY}.result.json" --review "data/extraction/review-inputs/${REVIEW_KEY}.review.json" --pdf "$RUNNER_TEMP/reviewed-source.pdf")
            if [[ "$MODE" == preview ]]; then arguments+=(--dry-run); fi
            uv run python -m src.workers review-import "${arguments[@]}" > "reports/runs/worker-${REVIEW_KEY}-latest.json" 2> "reports/runs/worker-${REVIEW_KEY}-latest.error.txt"
            operation_status=$?
          fi
          set -e
          echo "status=$operation_status" >> "$GITHUB_OUTPUT"
          echo "- Manual reviewed import ${REVIEW_KEY}: mode=${MODE}; exit=${operation_status}; only exact reviewed decisions are eligible. PDF remains temporary; inspect source/import receipts." >> "$GITHUB_STEP_SUMMARY"
          uv run python -m src.cli build
          uv run python -m src.cli validate
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
      - name: Persist validated generated changes on feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for generated_path in data/ingestion/backfill data/papers.json data/manifest.json data/papers data/aliases*.json data/signals data/archive data/extraction/reviewed.json docs/papers.json docs/data docs/assets README.md reports/coverage.md reports/runs; do
            if [[ -e "$generated_path" ]] || git ls-files --error-unmatch "$generated_path" >/dev/null 2>&1; then
              git add --all -- "$generated_path"
            fi
          done
          git fetch origin feed
          if [[ "$(git rev-parse origin/feed)" != "$EXPECTED_FEED" ]]; then
            echo "Feed advanced unexpectedly; refusing to overwrite." >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(manual): persist validated operation checkpoint"
            git push origin HEAD:feed
          fi
      - name: Report operation failure after persisting diagnostics
        if: steps.operation.outputs.status != '0'
        run: exit 1
